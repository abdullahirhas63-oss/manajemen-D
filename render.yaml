# Render Blueprint: website + database SQLite dengan disk persisten.
# Disk persisten di Render umumnya butuh paket berbayar (bukan free); cek paket terbaru di render.com.
services:
  - type: web
    name: kelas-manajemen-d
    runtime: node
    plan: starter
    buildCommand: "echo tanpa build"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: kelas-data
      mountPath: /var/data
      sizeGB: 1
